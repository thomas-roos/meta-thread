# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-thread"
BBFILE_PATTERN_meta-thread = "^${LAYERDIR}/"

LAYERDEPENDS_meta-thread = "core"

LAYERSERIES_COMPAT_meta-thread = "honister"
